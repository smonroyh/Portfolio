<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" font-family="'Geist Variable', ui-sans-serif, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b22"/>
      <stop offset="1" stop-color="#07071a"/>
    </linearGradient>
    <linearGradient id="lane" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1c48" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#0a0a20" stop-opacity="0.95"/>
    </linearGradient>
    <marker id="i" markerWidth="11" markerHeight="11" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="#818cf8"/>
    </marker>
    <marker id="a" markerWidth="11" markerHeight="11" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="#f59e0b"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bg2)"/>
  <rect x="0" y="0" width="1600" height="4" fill="#6366f1" opacity="0.5"/>

  <!-- Title -->
  <text x="70" y="70" fill="#f4f4f5" font-size="38" font-weight="700">Flujo de eventos — Saga coreografiada</text>
  <text x="70" y="102" fill="#8b8ba7" font-size="21">Confirmación del pedido vía eventos, con compensación si el pago falla</text>

  <!-- Legend -->
  <g font-size="17">
    <rect x="1140" y="58" width="22" height="10" rx="3" fill="#818cf8"/>
    <text x="1172" y="68" fill="#a1a1b5">Camino feliz</text>
    <rect x="1140" y="86" width="22" height="10" rx="3" fill="#f59e0b"/>
    <text x="1172" y="96" fill="#a1a1b5">Compensación</text>
  </g>

  <!-- Lanes -->
  <!-- Pedidos -->
  <line x1="250" y1="250" x2="1540" y2="250" stroke="#4f46e5" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="2 6"/>
  <rect x="50" y="212" width="190" height="76" rx="14" fill="url(#lane)" stroke="#4f46e5" stroke-opacity="0.5" stroke-width="1.5"/>
  <text x="145" y="247" text-anchor="middle" fill="#e4e4ef" font-size="22" font-weight="600">Pedidos</text>
  <text x="145" y="270" text-anchor="middle" fill="#8b8ba7" font-size="14">orquesta la saga</text>

  <!-- Pagos -->
  <line x1="250" y1="480" x2="1540" y2="480" stroke="#4f46e5" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="2 6"/>
  <rect x="50" y="442" width="190" height="76" rx="14" fill="url(#lane)" stroke="#4f46e5" stroke-opacity="0.5" stroke-width="1.5"/>
  <text x="145" y="477" text-anchor="middle" fill="#e4e4ef" font-size="22" font-weight="600">Pagos</text>
  <text x="145" y="500" text-anchor="middle" fill="#8b8ba7" font-size="14">procesa el cobro</text>

  <!-- Notificaciones -->
  <line x1="250" y1="710" x2="1540" y2="710" stroke="#4f46e5" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="2 6"/>
  <rect x="50" y="672" width="190" height="76" rx="14" fill="url(#lane)" stroke="#4f46e5" stroke-opacity="0.5" stroke-width="1.5"/>
  <text x="145" y="703" text-anchor="middle" fill="#e4e4ef" font-size="20" font-weight="600">Notificaciones</text>
  <text x="145" y="726" text-anchor="middle" fill="#8b8ba7" font-size="14">avisa al cliente</text>

  <!-- Step 1: crea pedido note on Pedidos -->
  <rect x="300" y="178" width="250" height="44" rx="10" fill="#312e81" stroke="#6366f1" stroke-opacity="0.5"/>
  <text x="425" y="206" text-anchor="middle" fill="#e0e7ff" font-size="16">crea pedido · pendiente_pago</text>

  <!-- pedido.creado: Pedidos -> Pagos -->
  <line x1="360" y1="250" x2="360" y2="478" stroke="#818cf8" stroke-width="2.5" marker-end="url(#i)"/>
  <!-- pedido.creado: Pedidos -> Notificaciones -->
  <line x1="430" y1="250" x2="430" y2="708" stroke="#818cf8" stroke-width="2.5" marker-end="url(#i)"/>
  <g>
    <rect x="300" y="350" width="170" height="30" rx="8" fill="#0b0b22" stroke="#4f46e5" stroke-opacity="0.5"/>
    <text x="385" y="370" text-anchor="middle" fill="#c7d2fe" font-size="15" font-family="ui-monospace, monospace">pedido.creado</text>
  </g>

  <!-- Step 2: procesa pago note on Pagos -->
  <rect x="540" y="500" width="240" height="44" rx="10" fill="#312e81" stroke="#6366f1" stroke-opacity="0.5"/>
  <text x="660" y="528" text-anchor="middle" fill="#e0e7ff" font-size="16">¿total ≤ 100? → aprobado</text>

  <!-- pago.aprobado: Pagos -> Pedidos (up) -->
  <line x1="720" y1="480" x2="720" y2="252" stroke="#818cf8" stroke-width="2.5" marker-end="url(#i)"/>
  <g>
    <rect x="635" y="350" width="170" height="30" rx="8" fill="#0b0b22" stroke="#4f46e5" stroke-opacity="0.5"/>
    <text x="720" y="370" text-anchor="middle" fill="#c7d2fe" font-size="15" font-family="ui-monospace, monospace">pago.aprobado</text>
  </g>

  <!-- estado confirmado note -->
  <rect x="800" y="178" width="210" height="44" rx="10" fill="#312e81" stroke="#6366f1" stroke-opacity="0.5"/>
  <text x="905" y="206" text-anchor="middle" fill="#e0e7ff" font-size="16">estado → confirmado</text>

  <!-- pedido.confirmado: Pedidos -> Notificaciones (down) -->
  <line x1="905" y1="250" x2="905" y2="708" stroke="#818cf8" stroke-width="2.5" marker-end="url(#i)"/>
  <g>
    <rect x="810" y="560" width="190" height="30" rx="8" fill="#0b0b22" stroke="#4f46e5" stroke-opacity="0.5"/>
    <text x="905" y="580" text-anchor="middle" fill="#c7d2fe" font-size="15" font-family="ui-monospace, monospace">pedido.confirmado</text>
  </g>

  <!-- COMPENSATION branch -->
  <!-- pago.denegado: Pagos -> Pedidos (up) -->
  <line x1="1180" y1="480" x2="1180" y2="252" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#a)"/>
  <g>
    <rect x="1095" y="350" width="170" height="30" rx="8" fill="#0b0b22" stroke="#f59e0b" stroke-opacity="0.5"/>
    <text x="1180" y="370" text-anchor="middle" fill="#fcd9a0" font-size="15" font-family="ui-monospace, monospace">pago.denegado</text>
  </g>
  <!-- estado cancelado note -->
  <rect x="1255" y="178" width="230" height="44" rx="10" fill="#3b2710" stroke="#f59e0b" stroke-opacity="0.5"/>
  <text x="1370" y="206" text-anchor="middle" fill="#fcd9a0" font-size="16">estado → cancelado</text>
  <!-- pedido.cancelado: Pedidos -> Notificaciones -->
  <line x1="1370" y1="250" x2="1370" y2="708" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#a)"/>
  <g>
    <rect x="1275" y="560" width="190" height="30" rx="8" fill="#0b0b22" stroke="#f59e0b" stroke-opacity="0.5"/>
    <text x="1370" y="580" text-anchor="middle" fill="#fcd9a0" font-size="15" font-family="ui-monospace, monospace">pedido.cancelado</text>
  </g>

  <!-- time axis -->
  <text x="250" y="850" fill="#6b6b85" font-size="16">tiempo →</text>
  <line x1="320" y1="845" x2="1480" y2="845" stroke="#3a3a5c" stroke-width="1.5" marker-end="url(#i)"/>
</svg>
